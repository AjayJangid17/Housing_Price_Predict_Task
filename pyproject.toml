[project]
name = "ml-api"
version = "0.1.0"
description = "Housing price prediction API (Task 1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=2.0",
    "joblib>=1.4",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false
# OneDrive-synced folders can't hardlink from uv's cache; copy files instead.
link-mode = "copy"
